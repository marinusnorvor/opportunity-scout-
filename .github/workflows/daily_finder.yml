name: Daily Autonomous Opportunity Scout

on:
  schedule:
    # Runs every day at 08:00 UTC (8:00 AM Ghana Time)
    - cron: '0 8 * * *'
  workflow_dispatch:
    # Allows manual trigger at any time from GitHub UI
    inputs:
      dry_run:
        description: 'Run in Dry Run mode (do not commit cache or send live email)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scout-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Autonomous Opportunity Pipeline
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -m src.main --dry-run
          else
            python -m src.main
          fi

      - name: Upload Output Artifacts (CSV & Email Preview)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scout-daily-artifacts
          path: output/
          retention-days: 7

      - name: Commit Updated Seen Jobs Cache
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/seen_jobs.json
          if git diff --quiet && git diff --staged --quiet; then
            exit 0
          fi

          git commit -m "chore: update seen_jobs cache [skip ci]"

          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              break
            fi
            [ "${attempt}" -lt 3 ] || exit 1
            sleep 2
          done
